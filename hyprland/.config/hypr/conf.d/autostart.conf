#################
### AUTOSTART ###
#################
# Port fidèle du spawn-at-startup de Niri (config.kdl)

# Shell Catalyst (Quickshell) — remplace waybar
exec-once = $catalyst/catalyst-session.sh

# Dock
exec-once = $HOME/.config/dock/launch.sh

# Polkit (absent de niri mais nécessaire sous Hyprland)
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# Applets & services
exec-once = blueman-applet
exec-once = /usr/bin/netbird-ui --daemon-addr unix:///var/run/netbird/main.sock

# Fond d'écran (gère awww/swww/mpvpaper + matugen)
exec-once = $niriScripts/wallpaper.sh restore && sleep 1 && $catalyst/catalyst-walls.sh restore

# Idle / lock
exec-once = hypridle

# Cliphist (clipboard history)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Publie l'environnement de la session dans systemd (services user : sekaipop-rs…)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE

# Workspaces dynamiques : pas de daemon, Hyprland détruit nativement les
# workspaces vides. dyn-ws.sh fournit la navigation (voir keybinds.conf).

# Remarques :
# - swaync n'est pas lancé : Catalyst possède les notifications (replaceWaybar)
# - sekaipop-rs est géré par son unité systemd user (active)
