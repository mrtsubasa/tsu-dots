#############
### RULES ###
#############
# Port des window-rule / layer-rule de Niri (config.kdl)

# --- Picture-in-Picture (YouTube, etc) ---
windowrule {
    name = pip-window
    match:title = ^(Picture-in-Picture)$

    float = true
    pin = true
    no_shadow = true
    size = 600 340
    move = 100%-w-20 100%-h-20
    no_initial_focus = true
}

# --- Ignore maximize requests from all apps ---
windowrule {
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

# --- Fix some dragging issues with XWayland ---
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# --- Niri : title "^BlackArch - " -> float min 900x600 ---
windowrule {
    name = blackarch-hud
    match:title = ^BlackArch -

    float = true
    size = 900 600
}

# --- Niri : blueman / portal gtk -> float ---
windowrule {
    name = float-blueman-portal
    match:class = ^(blueman-manager|xdg-desktop-portal-gtk)$

    float = true
}

# --- Niri : pavucontrol / easyeffects -> ouverture maximisée (tuilée) ---
# Pas de règle "maximize à l'ouverture" sous Hyprland : les fenêtres arrivent
# tuilées, Super+F (fullscreen 1) maximise avec les gaps.
windowrule {
    name = tile-mixer
    match:class = ^(pavucontrol|org\.pulseaudio\.pavucontrol|com\.github\.wwmm\.easyeffects)$

    float = false
}

# --- Niri : boîtes de dialogue de fichiers -> float ---
windowrule {
    name = float-file-dialogs
    match:title = ^(Open File|Enregistrer|Save As|Ouvrir)

    float = true
}

# --- Niri : tray-box (zone de notification) -> float collé en haut à droite ---
windowrule {
    name = tray-box
    match:class = ^tray-box$
    match:title = ^Zone de notification$

    float = true
    move = 100%-w-14 44
}

# --- Niri : panel Claude (flottant, collé à droite ; taille gérée par le script) ---
windowrule {
    name = claude-panel
    match:class = ^claude-panel$

    float = true
    move = 100%-w-16 16
}

# =============================================================================
# LAYER RULES (blur des surfaces quickshell)
# =============================================================================
layerrule {
    name = waybar-blur
    blur = on
    ignore_alpha = 0.2
    match:namespace = waybar
}

layerrule {
    name = apple-dock
    blur = on
    ignore_alpha = 0.2
    match:namespace = apple-dock
}

layerrule {
    name = swaync-cc
    blur = on
    ignore_alpha = 0.5
    match:namespace = swaync-control-center
}

layerrule {
    name = swaync-notif
    blur = on
    ignore_alpha = 0.5
    match:namespace = swaync-notification-window
}

layerrule {
    name = spell-blur
    blur = on
    ignore_alpha = 0.4
    match:namespace = ^(dashboard|ai|vm|scripts)$
}

layerrule {
    name = rofi-blur
    blur = on
    ignore_alpha = 0.3
    match:namespace = rofi
}

layerrule {
    name = overview-blur
    blur = on
    ignore_alpha = 0.3
    match:namespace = catalyst-overview
}

# Niri : catalyst-atelier a un background-effect blur
layerrule {
    name = catalyst-atelier-blur
    blur = on
    ignore_alpha = 0.1
    match:namespace = catalyst-atelier
}

# Tsubasa Catalyst v3 — surfaces Quickshell (flou derrière le verre uniquement :
# ignore_alpha exclut ombres et zones transparentes des fenêtres plein écran)
layerrule {
    name = catalyst-v3-blur
    blur = on
    ignore_alpha = 0.5
    match:namespace = ^(catalyst-bar|catalyst-stage|catalyst-dock|catalyst-notif|catalyst-osd)$
}

# Le flou ne s'applique qu'aux surfaces ciblées : jamais aux fenêtres
windowrule {
    name = catalyst-no-window-blur
    match:class = .*
    no_blur = true
}

# Terminal déroulant (Super+`) : workspace spécial « term », Alacritty créé
# à la première ouverture puis conservé (masqué/affiché instantanément)
workspace = special:term, on-created-empty:alacritty --class catalyst-term, gapsout:60
