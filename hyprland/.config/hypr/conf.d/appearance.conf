##################
### APPEARANCE ###
##################
# Port depuis Niri (config.kdl layout {} + animations {})

# Couleurs de repli (si matugen n'a pas encore tourné)
$col_active  = rgba(5cffe7ff)
$col_active2 = rgba(cba6f7ff)
$col_inactive = rgba(2a3036ff)

# Palette Matugen (écrase les replis si présent)
source = ~/.cache/matugen/hypr-colors.conf
source = ~/.cache/matugen/catalyst-accent.conf  # Tsubasa Catalyst : accents du thème complet (écrit par Quickshell)

general {
    # niri : gaps 10
    gaps_in = 10
    gaps_out = 10
    border_size = 2
    # niri focus-ring : active-gradient #5cffe7 -> #cba6f7 angle=135
    col.active_border = $col_active $col_active2 135deg
    # niri border : inactive-color #2a3036
    col.inactive_border = $col_inactive
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    # niri : geometry-corner-radius 14 (window-rule global)
    rounding = 14
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    # niri shadow : softness 36, spread 5, offset 0 8, rgba(0,0,0,0.46)
    shadow {
        enabled = true
        range = 36
        render_power = 3
        color = rgba(00000075)
        offset = 0 8
    }

    # Moteur de flou actif, mais désactivé pour toutes les fenêtres
    # (rules.conf : catalyst-no-window-blur) : seules les surfaces ciblées par
    # une layerrule (barre, panneaux Catalyst, rofi…) sont floutées.
    blur {
        enabled = true
        size = 7
        passes = 2
        noise = 0.015
        contrast = 0.95
        brightness = 0.85
        vibrancy = 0.12
        new_optimizations = true
        xray = false
        popups = false
    }
}

animations {
    enabled = true

    bezier = linear, 0, 0, 1, 1
    bezier = md3_standard, 0.2, 0, 0, 1
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = overshot, 0.05, 0.9, 0.1, 1.08
    bezier = fluent_decel, 0.1, 1, 0, 1
    # niri : courbe "ease-out-expo" (window-open)
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = easeOutCirc, 0, 0.55, 0.45, 1
    # niri : "ease-out-quad" (window-close)
    bezier = easeOutQuad, 0.5, 1, 0.89, 1

    # niri : window-open 220ms ease-out-expo / window-close 150ms ease-out-quad
    animation = windows, 1, 3, md3_decel, popin 62%
    animation = windowsIn, 1, 2.2, easeOutExpo, popin 62%
    animation = windowsOut, 1, 1.5, easeOutQuad, popin 62%
    animation = windowsMove, 1, 3, md3_decel, slide
    animation = border, 1, 10, default
    animation = borderangle, 1, 30, linear, loop
    animation = fade, 1, 3, md3_decel
    animation = fadeDim, 1, 3, md3_decel
    animation = fadeLayers, 1, 2.4, md3_decel
    animation = layers, 1, 3.2, fluent_decel, slide
    animation = layersIn, 1, 3.2, md3_decel, slide
    animation = layersOut, 1, 2.4, md3_accel, slide
    # niri : workspace-switch spring (rapide et nerveux)
    animation = workspaces, 1, 6, fluent_decel, slide
    animation = specialWorkspace, 1, 3.4, md3_decel, slidevert
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
    force_split = 0
}

master {
    new_status = master
    new_on_top = true
    mfact = 0.55
}

misc {
    # niri : background-color "#101417"
    background_color = rgb(101417)
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1
    animate_manual_resizes = true
    animate_mouse_windowdragging = false
    # DPMS off (Dashboard / hypridle) se réveille à l'input
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}
