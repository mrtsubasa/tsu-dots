#############
### INPUT ###
#############
# Port depuis Niri (config.kdl input {})

input {
    kb_layout = us
    kb_variant = altgr-intl
    repeat_delay = 250

    # niri : input.keyboard numlock
    numlock_by_default = true

    # niri : focus-follows-mouse max-scroll-amount="0%"
    follow_mouse = 1

    force_no_accel = true
    sensitivity = 0

    touchpad {
        # niri : touchpad { tap, natural-scroll }
        tap-to-click = true
        natural_scroll = true
    }
}

# Gestes 3 doigts -> navigation d'espace
gesture = 3, horizontal, workspace
