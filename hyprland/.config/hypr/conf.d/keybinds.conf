###################
### KEYBINDINGS ###
###################
# Port complet depuis Niri (config.kdl binds {})
# Mod == SUPER. Les équivalents approximatifs sont signalés en commentaire.

$mainMod = SUPER

# ==============================================================================
# APPS
# ==============================================================================
bind = $mainMod, Return,  exec, $terminal
bind = $mainMod, T,       exec, $terminal
bind = $mainMod, E,       exec, $terminal -e nvim
bind = $mainMod SHIFT, E, exec, $fileManager
bind = $mainMod, D,       exec, $niriScripts/spell-toggle.sh launcher
bind = $mainMod SHIFT, D, exec, rofi -show drun -theme-str "window { width: 30%; }"
bind = $mainMod ALT, L,   exec, hyprlock

# Mise à jour complète CachyOS (officiel + AUR + Flatpak + Snap)
bind = $mainMod CTRL, U,  exec, $terminal -e $HOME/.local/bin/cachyos-update

# ==============================================================================
# PANEL IA (claude / opencode / codex)
# ==============================================================================
bind = $mainMod, A,       exec, $niriScripts/claude_panel.sh
bind = $mainMod SHIFT, A, exec, $niriScripts/claude_panel_pick.sh
bind = $mainMod ALT, A,   exec, $niriScripts/claude_panel_bg.sh

# ==============================================================================
# HUD BLACKARCH & WIDGETS CATALYST (quickshell panels)
# ==============================================================================
bind = $mainMod, Space,        exec, $niriScripts/spell-toggle.sh blackarch
bind = $mainMod SHIFT, X,      exec, $niriScripts/spell-toggle.sh blackarch

bind = $mainMod, Y,            exec, $niriScripts/spell-toggle.sh dashboard
bind = $mainMod, N,            exec, $niriScripts/spell-toggle.sh ai
bind = $mainMod, B,            exec, $niriScripts/spell-toggle.sh vm
bind = $mainMod, S,            exec, $niriScripts/spell-toggle.sh scripts
bind = $mainMod, G,            exec, $niriScripts/spell-toggle.sh launcher
bind = $mainMod SHIFT, T,      exec, $niriScripts/spell-toggle.sh chat
bind = $mainMod SHIFT, B,      exec, $niriScripts/spell-toggle.sh bots
# Ops : Super+Ctrl+O (Super+Maj+O = vue d'ensemble ; les deux étaient sur la même touche)
bind = $mainMod CTRL, O,       exec, $niriScripts/spell-toggle.sh ops
bind = $mainMod SHIFT, K,      exec, $niriScripts/spell-toggle.sh pkgs
bind = $mainMod SHIFT, Comma,  exec, $niriScripts/spell-toggle.sh atelier

# ==============================================================================
# CLIPBOARD & WALLPAPERS
# ==============================================================================
bind = $mainMod, X,              exec, qs ipc -p $HOME/.config/quickshell/catalyst call panels toggle clip || $niriScripts/clipboard-picker.sh
bind = $mainMod SHIFT, W,        exec, $niriScripts/wallpaper_menu.sh
bind = $mainMod ALT, W,          exec, $niriScripts/wallpaper.sh random
bind = $mainMod CTRL, Space,     exec, $niriScripts/spell-toggle.sh omarchy
bind = $mainMod CTRL SHIFT, Space, exec, $niriScripts/spell-toggle.sh omarchy
bind = $mainMod ALT, T,          exec, $niriScripts/spell-toggle.sh omarchy

# ==============================================================================
# CAPTURES D'ÉCRAN (Grim + Slurp)
# ==============================================================================
# Super + Shift + S : sélection d'une zone -> sauvegarde + clipboard
bind = $mainMod SHIFT, S, exec, $niriScripts/quick_shot.sh region

# Print : tout l'écran -> sauvegarde + clipboard
bind = , Print, exec, $niriScripts/quick_shot.sh full

# ==============================================================================
# SHELL CATALYST, DOCK & SEKAIPOP-RS
# ==============================================================================
bind = $mainMod ALT, R, exec, $catalyst/catalyst-session.sh restart
bind = $mainMod ALT, D, exec, $HOME/.config/dock/launch.sh

# sekaipop-rs (GTK) : réglages / studio IA / layout editor
bind = $mainMod CTRL, S,      exec, sekaipop-rs --config
bind = $mainMod CTRL, A,      exec, sekaipop-rs --studio
bind = $mainMod SHIFT, R,     exec, sekaipop-rs --editor

# ==============================================================================
# PANNEAUX AUDIO (here.sh = bon moniteur)
# ==============================================================================
bind = $mainMod, P,       exec, $niriScripts/here.sh -- $niriScripts/audio-panel.sh
bind = $mainMod ALT, P,   exec, $niriScripts/here.sh -- $niriScripts/audio-panel.sh effects
bind = $mainMod SHIFT, P, exec, $niriScripts/here.sh -- $niriScripts/audio-return.sh

# ==============================================================================
# SYSTEM CONTROL (médias, volume, luminosité) — valables sous verrouillage
# ==============================================================================
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, qs ipc -p $HOME/.config/quickshell/catalyst call audio mic || wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = $mainMod CTRL, M,        exec, qs ipc -p $HOME/.config/quickshell/catalyst call audio mic
bind   = $mainMod ALT, V,         exec, qs ipc -p $HOME/.config/quickshell/catalyst call audio call

bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioStop, exec, playerctl stop
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next

bindel = , XF86MonBrightnessUp,   exec, qs ipc -p $HOME/.config/quickshell/catalyst call brightness up || $niriScripts/brightness.sh up
bindel = , XF86MonBrightnessDown, exec, qs ipc -p $HOME/.config/quickshell/catalyst call brightness down || $niriScripts/brightness.sh down

# ==============================================================================
# INTERFACE & MULTI-FENÊTRES
# ==============================================================================
# Overview : hyprexpo (miniatures live) si dispo, sinon panel Quickshell
bind = $mainMod, O,      exec, $overview
bind = $mainMod SHIFT, O, exec, qs ipc -p $HOME/.config/quickshell/catalyst call panels toggle overview
# Sélecteur de fenêtres (rofi) conservé sur Alt+Tab
bind = ALT, Tab,     exec, rofi -show window

bind = $mainMod, Q,  killactive,
bind = $mainMod SHIFT, Q, exit,
bind = CTRL ALT, Delete, exit,

# Win-park (catalyst) : regrouper/masquer les fenêtres
bind = $mainMod SHIFT, M, exec, $catalyst/win-park.sh park

# ==============================================================================
# FOCUS & DÉPLACEMENT DES FENÊTRES
# ==============================================================================
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
# niri : Mod+J/K = focus-window-or-workspace-down/up (approx : focus de fenêtre)
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, Down, movefocus, d
bind = $mainMod, Up,   movefocus, u

# niri : move-column-* -> déplacer la fenêtre dans le sens voulu
bind = $mainMod CTRL, Left,  movewindow, l
bind = $mainMod CTRL, Right, movewindow, r
bind = $mainMod CTRL, H,     movewindow, l
bind = $mainMod CTRL, L,     movewindow, r
bind = $mainMod CTRL, Down,  exec, $dynWs move-next
bind = $mainMod CTRL, Up,    exec, $dynWs move-prev
bind = $mainMod CTRL, J,     exec, $dynWs move-next
bind = $mainMod CTRL, K,     exec, $dynWs move-prev

# Redimensionnement (niri : set-column-width ±10% / set-window-height ±10%)
bindel = $mainMod, Minus,  resizeactive, -80 0
bindel = $mainMod, Equal,  resizeactive, 80 0
bindel = $mainMod SHIFT, Minus, resizeactive, 0 -80
bindel = $mainMod SHIFT, Equal, resizeactive, 0 80

# (Pas d'équivalent natif : preset-column-width Mod+R / Mod+Alt+1-4,
#  focus-column-first/last Mod+Home/End, switch-focus-floating Mod+Shift+V)

# Drag / resize à la souris
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ==============================================================================
# MONITEURS
# ==============================================================================
bind = $mainMod ALT, Left,  focusmonitor, l
bind = $mainMod ALT, Right, focusmonitor, r
bind = $mainMod ALT, H,     focusmonitor, l
# ($mainMod ALT, L = focusmonitor r sous niri, mais entre en conflit avec
#  Super+Alt+L = hyprlock ; Alt+Right couvre déjà ce besoin)
bind = $mainMod ALT SHIFT, Left,  movewindow, mon:l
bind = $mainMod ALT SHIFT, Right, movewindow, mon:r
bind = $mainMod ALT SHIFT, H,     movewindow, mon:l
bind = $mainMod ALT SHIFT, L,     movewindow, mon:r
# (move-workspace-to-monitor Mod+Alt+Ctrl+Left/Right : pas d'équivalent direct)

# ==============================================================================
# WORKSPACES (dynamiques — dyn-ws.sh, style niri)
# ==============================================================================
# Navigation relative par moniteur (crée un nouvel espace au bout de la pile)
bind = $mainMod, Left,       exec, $dynWs prev
bind = $mainMod, Right,      exec, $dynWs next
bind = $mainMod, U,          exec, $dynWs next
bind = $mainMod, I,          exec, $dynWs prev
bind = $mainMod, Page_Down,  exec, $dynWs next
bind = $mainMod, Page_Up,    exec, $dynWs prev

# Déplacer la fenêtre active d'un espace
bind = $mainMod SHIFT, Left,  exec, $dynWs move-prev
bind = $mainMod SHIFT, Right, exec, $dynWs move-next
bind = $mainMod SHIFT, U,     exec, $dynWs move-next
bind = $mainMod SHIFT, I,     exec, $dynWs move-prev
bind = $mainMod SHIFT, Page_Down, exec, $dynWs move-next
bind = $mainMod SHIFT, Page_Up,   exec, $dynWs move-prev

# Nouvel espace dynamique
bind = $mainMod SHIFT, N, exec, $dynWs new

# Accès direct (1-9 = Nième espace du moniteur courant)
bind = $mainMod, 1, exec, $dynWs switch 1
bind = $mainMod, 2, exec, $dynWs switch 2
bind = $mainMod, 3, exec, $dynWs switch 3
bind = $mainMod, 4, exec, $dynWs switch 4
bind = $mainMod, 5, exec, $dynWs switch 5
bind = $mainMod, 6, exec, $dynWs switch 6
bind = $mainMod, 7, exec, $dynWs switch 7
bind = $mainMod, 8, exec, $dynWs switch 8
bind = $mainMod, 9, exec, $dynWs switch 9

# Déplacer la fenêtre active vers un espace
bind = $mainMod CTRL, 1, exec, $dynWs move 1
bind = $mainMod CTRL, 2, exec, $dynWs move 2
bind = $mainMod CTRL, 3, exec, $dynWs move 3
bind = $mainMod CTRL, 4, exec, $dynWs move 4
bind = $mainMod CTRL, 5, exec, $dynWs move 5
bind = $mainMod CTRL, 6, exec, $dynWs move 6
bind = $mainMod CTRL, 7, exec, $dynWs move 7
bind = $mainMod CTRL, 8, exec, $dynWs move 8
bind = $mainMod CTRL, 9, exec, $dynWs move 9

# ==============================================================================
# GROUPES (tab groups niri) & GÉOMÉTRIE
# ==============================================================================
bind = $mainMod, W,           togglegroup,
# (togglesplit n'existe plus sous Hyprland 0.56)
bind = $mainMod, Comma,       movewindoworgroup,
bind = $mainMod, Period,      moveoutofgroup,
bind = $mainMod, BracketLeft,  moveintogroup, l
bind = $mainMod, BracketRight, moveintogroup, r

# ==============================================================================
# FLOATING, PLEIN ÉCRAN, CENTRAGE
# ==============================================================================
bind = $mainMod,        V, togglefloating,
# niri : maximize-column (Super+F) -> maximiser en gardant les gaps
bind = $mainMod,        F, fullscreen, 1
# niri : fullscreen-window (Super+Shift+F) -> plein écran réel
bind = $mainMod SHIFT,  F, fullscreen, 0
# niri : center-column
bind = $mainMod,        C, centerwindow,

# ==============================================================================
# OUTILS (menus : Informatique · Design · Musique · Divers)
# ==============================================================================
bind = $mainMod SHIFT, G, exec, $niriScripts/tools_menu.sh
bind = $mainMod ALT,   S, exec, $niriScripts/shot_menu.sh
bind = $mainMod ALT,   C, exec, $niriScripts/color_pick.sh
bind = $mainMod ALT,   M, exec, $niriScripts/music_menu.sh
bind = $mainMod SHIFT, Y, exec, $niriScripts/translate_sel.sh
