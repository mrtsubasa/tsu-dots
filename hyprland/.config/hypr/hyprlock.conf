# Tsubasa Catalyst — écran de verrouillage (hyprlock, authentification PAM)
# Couleurs : ~/.cache/matugen/hyprlock-colors.conf (thème actif, theme-sync.py)
# Fond     : ~/.cache/matugen/hyprlock-bg.conf (fond d'écran courant)
# Composition : interface à gauche, l'artwork reste visible à droite.
# Version précédente : ~/.config/quickshell/backups/hyprlock.conf.pre-v3

source = ~/.cache/matugen/hyprlock-colors.conf
source = ~/.cache/matugen/hyprlock-bg.conf

$display = Space Grotesk
$ui = Inter
$mono = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    immediate_render = true
    text_trim = true
    fail_timeout = 2000
}

animations {
    enabled = true
    bezier = decel, 0.05, 0.7, 0.1, 1
    animation = fadeIn, 1, 2.6, decel
    animation = fadeOut, 1, 1.6, decel
    animation = inputFieldColors, 1, 1.4, decel
    animation = inputFieldFade, 1, 1.2, decel
}

background {
    monitor =
    path = $bg
    color = $surface
    blur_passes = 2
    blur_size = 5
    brightness = 0.78
    contrast = 0.95
    noise = 0.01
    vibrancy = 0.14
}

# voile général
shape {
    monitor =
    size = 100%, 100%
    color = $veil
    rounding = 0
    border_size = 0
    halign = center
    valign = center
    zindex = 0
}

# panneau de lecture à gauche (assombrit la zone de texte uniquement)
shape {
    monitor =
    size = 640, 100%
    color = rgba(0, 0, 0, 0.32)
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = left
    valign = center
    zindex = 1
}

# filet d'accent vertical (signature Catalyst)
shape {
    monitor =
    size = 3, 132
    color = $primary
    rounding = 2
    border_size = 0
    position = 96, 96
    halign = left
    valign = center
    zindex = 2
}

# ---- micro-label ----
label {
    monitor =
    text = cmd[update:60000] echo "//  $(date +'%A' | tr '[:lower:]' '[:upper:]')  ·  VERROUILLÉ"
    font_size = 12
    font_family = $mono
    color = $primary
    position = 120, 196
    halign = left
    valign = center
    zindex = 3
}

# ---- heure ----
label {
    monitor =
    text = cmd[update:1000] echo "<span font_weight='500'>$(date +'%H:%M')</span>"
    font_size = 112
    font_family = $display
    color = $onSurface
    position = 112, 112
    halign = left
    valign = center
    zindex = 3
}

# ---- date ----
label {
    monitor =
    text = cmd[update:60000] date +'%-d %B %Y'
    font_size = 20
    font_family = $ui
    color = $onSurfaceVariant
    position = 120, 22
    halign = left
    valign = center
    zindex = 3
}

# ---- utilisateur ----
image {
    monitor =
    path = ~/.cache/matugen/lock-avatar.png
    size = 52
    rounding = -1
    border_size = 2
    border_color = $primary
    position = 120, -76
    halign = left
    valign = center
    zindex = 3
    reload_time = -1
}

label {
    monitor =
    text = cmd[update:0] echo "<b>$(getent passwd $USER | cut -d: -f5 | cut -d, -f1 | sed 's/^$/'"$USER"'/')</b>"
    font_size = 15
    font_family = $ui
    color = $onSurface
    position = 186, -64
    halign = left
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[update:0] echo "$USER@$(hostname -s)"
    font_size = 11
    font_family = $mono
    color = $onSurfaceVariant
    position = 186, -88
    halign = left
    valign = center
    zindex = 3
}

input-field {
    monitor =
    size = 360, 48
    rounding = 14
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.32
    dots_center = false
    dots_rounding = -1
    outer_color = $outlineVariant
    inner_color = $field
    font_color = $onSurface
    font_family = $ui
    fade_on_empty = false
    placeholder_text = Mot de passe…
    fail_text = <span>Échec · $ATTEMPTS tentative(s)</span>
    check_color = $primary
    fail_color = $error
    capslock_color = $tertiary
    position = 120, -152
    halign = left
    valign = center
    zindex = 3
    shadow_passes = 0
}

label {
    monitor =
    text = Entrée pour déverrouiller  ·  Verr. Maj signalé en rose
    font_size = 10
    font_family = $ui
    color = $onSurfaceVariant
    position = 124, -196
    halign = left
    valign = center
    zindex = 3
}

# ---- lecture en cours (si un lecteur MPRIS joue) ----
label {
    monitor =
    text = cmd[update:4000] t="$(playerctl metadata --format '{{title}}' 2>/dev/null | cut -c1-48)"; a="$(playerctl metadata --format '{{artist}}' 2>/dev/null | cut -c1-32)"; [ -n "$t" ] && echo "♪  $t${a:+  ·  $a}"
    font_size = 11
    font_family = $ui
    color = $onSurfaceVariant
    position = 120, 56
    halign = left
    valign = bottom
    zindex = 3
}

# ---- marque ----
label {
    monitor =
    text = ◆  tsubasa catalyst
    font_size = 10
    font_family = $mono
    color = $tertiary
    position = 120, 28
    halign = left
    valign = bottom
    zindex = 3
}
