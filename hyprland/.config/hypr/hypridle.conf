general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.config/niri/scripts/idle-dpms.sh on
    ignore_dbus_inhibit = false
}

listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 600
    on-timeout = pidof hyprlock || hyprlock
}

listener {
    timeout = 900
    on-timeout = ~/.config/niri/scripts/idle-dpms.sh off
    on-resume = ~/.config/niri/scripts/idle-dpms.sh on
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
