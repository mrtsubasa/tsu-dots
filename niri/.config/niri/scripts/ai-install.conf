# ══════════════════════════════════════════════════════════════════════
# ai-install.conf — « comment installer » les IA du catalogue
#
# Format :  nom|commande d'installation
#   • nom = celui de ai-engines.conf (croisement automatique)
#   • La commande s'exécute telle quelle dans le popup du menu
#     (prefix + i → 📦 Installer). Les « pacman -S » passent par le
#     trousseau cachyos-askpass : aucun mot de passe à taper.
#   • Seules les IA du catalogue NON installées sont proposées.
#   • Ajoute ici tes propres outils quand tu en crées un.
# ══════════════════════════════════════════════════════════════════════

gemini|npm i -g @google/gemini-cli
aider|pipx install aider-chat
amp|npm i -g @sourcegraph/amp
auggie|npm i -g @augmentcode/auggie
amazon-q|npm i -g @aws/amazon-q-developer-cli
mcpm|npm i -g mcpm
cursor-agent|curl https://cursor.com/install -fsS | bash
ollama|pacman -S ollama
aichat|paru -S aichat
gptme|pipx install gptme
llm|pipx install llm
sgpt|pipx install sgpt
openhands|pipx install openhands-cli
