# ══════════════════════════════════════════════════════════════════════
# ai-engines.conf — Catalogue des IA pour le panel (Super+A)
#
# Format :   nom-affiché|commande
#   • « nom » sans espace ni « | » (c'est lui qui apparaît dans le menu).
#   • « commande » = binaire (+ args éventuels) lancé DANS le dossier
#     courant du panel. Seul le premier mot est cherché dans le PATH.
#   • Toute IA dont la commande est absente du PATH est MASQUÉE : ce
#     fichier peut lister tout ce qui existe, seules celles réellement
#     installées apparaissent dans le panel.
#
# Ajouter sans éditer de fichier :  panel → Ctrl+B → i → « ➕ Ajouter »
# Installer un outil du catalogue : panel → Ctrl+B → i → « 📦 Installer »
# Aide-mémoire d'installation    : ai-install.conf (à côté de ce fichier)
# Les commentaires doivent être sur leur propre ligne.
# ══════════════════════════════════════════════════════════════════════

