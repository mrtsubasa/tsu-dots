# Matugen — palette Material You générée depuis le wallpaper
# Éditer les templates dans ~/.config/matugen/templates/ puis relancer:
#   wallpaper.sh set <image>  (ou)  matugen image <image> -t scheme-content --prefer saturation

[config]
type = "scheme-content"

[templates.waybar]
input_path = '~/.config/matugen/templates/waybar.css'
output_path = '~/.config/waybar/colors.css'

[templates.swaync]
input_path = '~/.config/matugen/templates/swaync.css'
output_path = '~/.config/swaync/style.css'

[templates.spell]
input_path = '~/.config/matugen/templates/spell-colors.json'
output_path = '~/.cache/matugen/spell-colors.json'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprlock-colors.conf'
output_path = '~/.cache/matugen/hyprlock-colors.conf'

[templates.gtk3-colors]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'

[templates.gtk4-colors]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/.cache/matugen/rofi-colors.rasi'

[templates.hypr]
input_path = '~/.config/matugen/templates/hypr-colors.conf'
output_path = '~/.cache/matugen/hypr-colors.conf'

[templates.qt]
input_path = '~/.config/matugen/templates/qt-colors.colors'
output_path = '~/.local/share/color-schemes/Catalyst.colors'
post_hook = 'python3 ~/.config/quickshell/catalyst/scripts/theme-sync.py --qt'
